name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, so skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the Sjovt Dansk Danish-grammar games (vanilla JS, opened from file://).
            Focus on:
            - Bugs and regressions in game logic, scoring and SRS/localStorage keys.
            - Placeholder or test content in data files (e.g. "Test sentence N.", "opt1"/"opt2",
              "Test note.") - this has broken a game before. Flag it as a blocker.
            - data.js mode keys and levels that do not match what the game's index.html expects.
            - Danish grammar errors in sentences, options, notes or explanations.
            - Accessibility and layout at 360 px, console errors, broken file:// loading.
            Use inline comments for specific lines and one short summary comment.
            Do not push commits in this job; review only.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(node shared/validate.js),Read,Glob,Grep"
